name: xdocs-local
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: xdocs
      POSTGRES_PASSWORD: xdocs-local-only
      POSTGRES_DB: xdocs
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xdocs"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-development-only
      KC_HOSTNAME: http://127.0.0.1:58080
    ports: ["127.0.0.1:58080:8080"]
    volumes:
      [
        "./realm.json:/opt/keycloak/data/import/realm.json:ro",
        "keycloak-data:/opt/keycloak/data",
      ]
volumes:
  postgres-data:
  keycloak-data:
