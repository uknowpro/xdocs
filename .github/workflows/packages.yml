name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged desktop
        shell: bash
        env:
          XDOCS_EXECUTABLE: ${{ runner.os == 'Windows' && 'release/win-unpacked/xdocs.exe' || runner.os == 'macOS' && 'release/mac-arm64/xdocs.app/Contents/MacOS/xdocs' || 'release/linux-unpacked/xdocs' }}
        run: |
          for suite in desktop infrastructure architecture sheets analyzer; do
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              xvfb-run -a npm run "test:$suite"
            else
              npm run "test:$suite"
            fi
          done
      - name: Verify Windows installer upgrade and scaled canvas
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'xdocs-upgrade'
          $install = Join-Path $fixture 'app'
          $exe = Join-Path $install 'xdocs.exe'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $source = Join-Path $fixture 'source'
          git fetch --depth=1 origin b512ce4aa79f7db5c7db0e4accaf116b74823fab
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git worktree add --detach $source b512ce4aa79f7db5c7db0e4accaf116b74823fab
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location $source
          try {
            npm ci
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            npm run dist -- --publish never
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $old = (Get-ChildItem 'release/*.exe').FullName
          } finally { Pop-Location }
          function Install-Xdocs($file) {
            $result = Start-Process -FilePath $file -ArgumentList "/S /D=$install" -PassThru -Wait
            if ($result.ExitCode) { throw "Installer failed: $($result.ExitCode)" }
          }
          Install-Xdocs $old
          node tests/windows-upgrade.mjs seed $exe $fixture 0.5.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Install-Xdocs (Get-ChildItem 'release/*.exe').FullName
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          foreach ($scale in @('1.25', '1.5')) {
            node tests/windows-upgrade.mjs verify $exe $fixture $version $scale
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: xdocs-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/alpha*.yml
            release/beta*.yml
            release/*.blockmap
          if-no-files-found: error
