name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
      - run: npm run test:infrastructure
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:infrastructure
        if: runner.os == 'Linux'
      - run: npm run test:architecture
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:architecture
        if: runner.os == 'Linux'
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: xdocs-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/alpha*.yml
            release/beta*.yml
            release/*.blockmap
          if-no-files-found: error
