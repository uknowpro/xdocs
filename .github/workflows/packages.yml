name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged desktop
        shell: bash
        env:
          XDOCS_EXECUTABLE: ${{ runner.os == 'Windows' && 'release/win-unpacked/xdocs.exe' || runner.os == 'macOS' && 'release/mac-arm64/xdocs.app/Contents/MacOS/xdocs' || 'release/linux-unpacked/xdocs' }}
        run: |
          for suite in desktop infrastructure architecture sheets; do
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              xvfb-run -a npm run "test:$suite"
            else
              npm run "test:$suite"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: xdocs-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/alpha*.yml
            release/beta*.yml
            release/*.blockmap
          if-no-files-found: error
