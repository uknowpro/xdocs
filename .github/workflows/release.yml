name: Signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (v0.3.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const p=require('./package.json');if(process.env.RELEASE_TAG!=='v'+p.version)process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Require signing configuration
        if: runner.os != 'Linux'
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node -e "const keys=['CSC_LINK','CSC_KEY_PASSWORD',...(process.platform==='darwin'?['APPLE_ID','APPLE_APP_SPECIFIC_PASSWORD','APPLE_TEAM_ID']:[])];if(keys.some(k=>!process.env[k]))throw Error('Signing configuration is incomplete')"
      - name: Build signed Windows / notarized macOS packages
        if: runner.os != 'Linux'
        run: npm run dist -- --publish never -c.forceCodeSigning=true -c.mac.notarize=true
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: release
          merge-multiple: true
      - name: Draft release with updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "xdocs $RELEASE_TAG" --generate-notes ./*
